name: E2E Tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: VibeTest/vibetest.client

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vibetest
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: vibetest_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vibetest -d vibetest_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=vibetest_e2e;Username=vibetest;Password=changeme

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: VibeTest/vibetest.client/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run guest E2E
        run: npm run e2e:guest

      - name: Run full E2E
        run: npm run e2e:full

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            VibeTest/vibetest.client/playwright-report/
            VibeTest/vibetest.client/test-results/
          retention-days: 7
