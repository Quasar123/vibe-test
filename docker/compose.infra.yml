services:
  postgres:
    image: postgres:16-alpine
    container_name: vibetest-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vibetest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-vibetest}
    volumes:
      - vibetest_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vibetest} -d ${POSTGRES_DB:-vibetest}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  vibetest_postgres_data:
