services:
  postgres:
    image: postgres:16-alpine
    container_name: vibetest-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vibetest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-vibetest}
    volumes:
      - vibetest_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vibetest} -d ${POSTGRES_DB:-vibetest}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/server/Dockerfile
    container_name: vibetest-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-vibetest};Username=${POSTGRES_USER:-vibetest};Password=${POSTGRES_PASSWORD:-changeme}
      Jwt__Key: ${JWT_KEY:-dev-secret-key-change-in-production-32chars!}
      Jwt__Issuer: VibeTest
      Jwt__Audience: VibeTest
      Cors__AllowedOrigins__0: ${WEB_ORIGIN:-http://localhost:8080}
      LogOutput__Destination: None
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: ..
      dockerfile: docker/web/Dockerfile
      args:
        VITE_APP_MODE: full
        VITE_BASE_PATH: /
        VITE_API_URL: /api
    container_name: vibetest-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  vibetest_postgres_data:
